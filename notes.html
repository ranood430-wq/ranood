<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Notes 💌💕 | For My Ranood</title>
    <link rel="stylesheet" href="shared-nav.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe4ec 45%, #ffd1dc 75%, #fff0f5 100%);
            min-height: 100vh;
            color: #4a2c3a;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px;
        }

        /* Header */
        .page-header {
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 240, 245, 0.9));
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 36px;
            padding: 40px 30px;
            margin-bottom: 35px;
            box-shadow: 0 15px 45px rgba(255, 105, 180, 0.22);
            backdrop-filter: blur(15px);
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #d81b60;
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 1.15rem;
            color: #7a4d64;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Love Notes List */
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-bottom: 40px;
        }

        .note-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 182, 193, 0.55);
            border-radius: 28px;
            padding: 30px 35px;
            position: relative;
            box-shadow: 0 12px 35px rgba(255, 105, 180, 0.16),
                        inset 0 0 20px rgba(255, 240, 245, 0.6);
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: linear-gradient(180deg, #ff69b4, #ff1493);
            border-radius: 8px 0 0 8px;
        }

        .note-card:hover {
            transform: translateY(-5px) scale(1.015);
            box-shadow: 0 18px 50px rgba(255, 105, 180, 0.28);
            border-color: #ff69b4;
            background: #ffffff;
        }

        .note-left {
            display: flex;
            align-items: center;
            gap: 22px;
            flex: 1;
        }

        .note-icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe4ec, #fff0f5);
            border: 2px solid #ffb6c1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            transition: transform 0.3s ease;
        }

        .note-card:hover .note-icon-badge {
            transform: scale(1.15) rotate(10deg);
        }

        .note-phrase {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            color: #d81b60;
            font-weight: 700;
            line-height: 1.35;
        }

        .note-heart {
            font-size: 1.8rem;
            color: #ff1493;
            flex-shrink: 0;
            animation: pulseHeart 2s infinite ease-in-out;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2.2rem;
            }
            .note-card {
                padding: 24px 20px;
            }
            .note-phrase {
                font-size: 1.45rem;
            }
            .note-icon-badge {
                width: 44px;
                height: 44px;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <div class="site-nav-container">
        <nav class="site-navbar">
            <a href="birthday.html" class="nav-brand">
                <span class="brand-icon">💕</span>
                <span>For Ranood</span>
            </a>

            <button class="mobile-toggle" aria-label="Toggle navigation">
                ☰
            </button>

            <ul class="nav-links">
                <li class="nav-item">
                    <a href="birthday.html" class="nav-link">
                        <span class="icon">🎂</span> Ur Birthday
                    </a>
                </li>
                <li class="nav-item">
                    <a href="music.html" class="nav-link">
                        <span class="icon">🎵</span> Music
                    </a>
                </li>
                <li class="nav-item">
                    <a href="notes.html" class="nav-link active">
                        <span class="icon">💌</span> Love Notes
                    </a>
                </li>
                <li class="nav-item">
                    <a href="memories.html" class="nav-link">
                        <span class="icon">📸</span> Memories
                    </a>
                </li>
            </ul>

            <div class="nav-actions">
                <button class="nav-btn" onclick="RanoodAuth.lock()" title="Re-lock with secret code">
                    🔒 Lock
                </button>
            </div>
        </nav>
    </div>

    <div class="main-container">

        <!-- Page Header -->
        <header class="page-header">
            <div class="header-badge">💌 From My Heart 💖</div>
            <h1 class="page-title">Love Notes</h1>
            <p class="page-subtitle">
                Forever written in my heart for you 💕
            </p>
        </header>

        <!-- Love Notes List - ONLY THE EXACT REQUESTED PHRASES -->
        <div class="notes-list">

            <!-- NOTE 1 -->
            <div class="note-card" onclick="popHeart(event)">
                <div class="note-left">
                    <div class="note-icon-badge">🕊️</div>
                    <div class="note-phrase">I will never leave you</div>
                </div>
                <div class="note-heart">💕</div>
            </div>

            <!-- NOTE 2 -->
            <div class="note-card" onclick="popHeart(event)">
                <div class="note-left">
                    <div class="note-icon-badge">💖</div>
                    <div class="note-phrase">I love you</div>
                </div>
                <div class="note-heart">💗</div>
            </div>

            <!-- NOTE 3 -->
            <div class="note-card" onclick="popHeart(event)">
                <div class="note-left">
                    <div class="note-icon-badge">🌸</div>
                    <div class="note-phrase">iam always with you</div>
                </div>
                <div class="note-heart">💕</div>
            </div>

            <!-- NOTE 4 -->
            <div class="note-card" onclick="popHeart(event)">
                <div class="note-left">
                    <div class="note-icon-badge">✨</div>
                    <div class="note-phrase">you are the sweetest person i have ever met</div>
                </div>
                <div class="note-heart">👑</div>
            </div>

            <!-- NOTE 5 -->
            <div class="note-card" onclick="popHeart(event)">
                <div class="note-left">
                    <div class="note-icon-badge">💍</div>
                    <div class="note-phrase">you are my whole life</div>
                </div>
                <div class="note-heart">💖</div>
            </div>

        </div>

    </div>

    <script src="shared-nav.js"></script>
    <script>
        function popHeart(e) {
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.innerText = ['💕', '💖', '✨', '🌸'][Math.floor(Math.random() * 4)];
                heart.style.position = 'fixed';
                heart.style.left = (e.clientX + (Math.random() - 0.5) * 40) + 'px';
                heart.style.top = (e.clientY + (Math.random() - 0.5) * 40) + 'px';
                heart.style.fontSize = '24px';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '99999';
                heart.style.transition = 'all 0.8s ease-out';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.style.transform = `translate(${(Math.random() - 0.5) * 80}px, -${Math.random() * 80 + 30}px) scale(1.3)`;
                    heart.style.opacity = '0';
                }, 20);

                setTimeout(() => heart.remove(), 850);
            }
        }
    </script>
</body>
</html>
